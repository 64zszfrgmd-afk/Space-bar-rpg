name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish tested 0.21.0 ZIP and visual evidence (world-fixes branch only)
        type: boolean
        default: false
        required: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - name: Save browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-launch-tests
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages-production
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

  release_preview:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_preview && github.ref == 'refs/heads/feature/v0.21-world-fixes'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: v021-world-fixes-release
      cancel-in-progress: false
    env:
      RELEASE_TAG: v0.21.0-preview.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python3 scripts/package-release.py
      - uses: actions/download-artifact@v4
        with:
          name: mobile-launch-tests
          path: test-results
      - run: python3 scripts/package-visual-report.py
      - name: Upload source and build ZIP, then publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/spacebar-release-notes.md"
          cat > "$notes" <<EOF
          **Space Bar RPG 0.21.0 — исправление отображения миров и NPC** поверх main 0.20 R2.

          Исправлен узкий портретный обзор: виден целый интерьер и жители; есть наведение камеры на NPC. Переход строит и отрисовывает новую сцену перед сменой состояния; при ошибке сохраняет предыдущий мир и прогресс. Добавлены диагностика и повтор загрузки. Сохранены девять интерьеров, три новые планеты, 23 NPC, пять героев, десять заданий, экономика, напитки, сиденья, танцы, ритм и сохранения.

          ZIP игры содержит исходники и готовый dist. RELEASE-MANIFEST.json указывает коммит и SHA-256 файлов. Отдельный visual-report.zip содержит реальные PNG/HTML/JSON Chromium и WebKit: 9 локаций, 23 NPC, 5 героев, видимые пиксели, диалоги и проверку отказа загрузки. PNG контактных листов доступны отдельно. У архивов есть .sha256. Все девять локаций и имена жителей перечислены в docs/WORLD-FIXES-021.md.

          Запуск: Node.js 22.12+, npm install, npm run preview -- --port 5173, путь /Space-bar-rpg/. На iPhone открыть HTTPS-предпросмотр порта 5173 в Safari. ZIP в приложении «Файлы» не запускает игру.

          Исходный коммит: $GITHUB_SHA.
          Проверки: npm ci, Vitest, TypeScript/Vite, production URL/MIME, полный браузерный прогон Chromium/WebKit. Физический iPhone и FPS не проверены.
          [Проверки и публикация]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).

          Ветка feature/v0.21-world-fixes подготовлена в отдельном Pull Request. Merge и production Pages — только после подтверждения владельца. Старые релизы сохранены.

          EOF
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]; then
              echo 'Existing published release must not be overwritten; choose a new preview tag.'
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease --title 'Space Bar RPG 0.21.0 — исправления мира и NPC' --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" artifacts/spacebar-rpg-0.21.0.zip artifacts/spacebar-rpg-0.21.0.zip.sha256 artifacts/spacebar-rpg-0.21.0-visual-report.zip artifacts/spacebar-rpg-0.21.0-visual-report.zip.sha256 test-results/world-visual/*-contact-sheet.png --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
