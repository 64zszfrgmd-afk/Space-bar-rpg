name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish the tested 0.20 history-2 ZIP (restore-chat-history only)
        type: boolean
        default: false
        required: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - name: Save browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-launch-tests
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages-production
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

  release_preview:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_preview && github.ref == 'refs/heads/feature/restore-chat-history'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: restored-v020-history-release
      cancel-in-progress: false
    env:
      RELEASE_TAG: v0.20.0-restored-preview.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python3 scripts/package-release.py
      - name: Upload source and build ZIP, then publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/spacebar-release-notes.md"
          cat > "$notes" <<EOF
          Восстановленная **Space Bar RPG 0.20.0 / history-2**, поверх опубликованной 0.20. Запросы из доступного чата сопоставлены реализации в docs/RESTORE-HISTORY.md. Это не точная копия недоступного a8b5510.

          Сохранены Боркс, семь напитков, десять исходных сидений, два задания Зипа, Бип и его рецепты, камеры, управление и старые сохранения. Добавлены три планеты, четыре бара и четыре клуба (включая исходный), каюта, 23 NPC, пять видов героя, три танца, сюжет с двумя способами вернуть пропуск, семь поручений, ритм-игра, графика и громкость. Всего девять локаций и десять заданий. Перелёты бесплатные. Мультиплеер и свободное ИИ-общение не реализованы.

          ZIP содержит исходники и готовый dist. RELEASE-MANIFEST.json указывает коммит и SHA-256 файлов. Файл .sha256 рядом с ZIP проверяет архив. Кеши, node_modules и сохранения пользователей не включены.

          Запуск: Node.js 22.12+, npm install, npm run preview -- --port 5173. Путь /Space-bar-rpg/. На iPhone: предпросмотр порта 5173 в Codex Cloud по HTTPS, открыть в Safari. ZIP в приложении «Файлы» не запускает веб-игру.

          Исходный коммит: $GITHUB_SHA.
          Проверки: npm ci, Vitest, TypeScript/Vite, production URL/MIME, Chromium и WebKit (мобильный HUD, прежние покупки/10 сидений/задания Зипа, обе сюжетные ветки, все девять локаций, семь поручений, герой, настройки и сохранения). Физический iPhone/Android и FPS не проверены.
          [Успешная проверка сборки]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).

          Ветка feature/restore-chat-history подготовлена в отдельном PR. Production Pages обновится только после подтверждённого владельцем merge; предыдущая опубликованная 0.20 и её ZIP сохранены.
          EOF
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]; then
              echo 'Existing published release must not be overwritten; choose a new preview tag.'
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease --title 'Space Bar RPG 0.20 — восстановленная сборка' --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" artifacts/spacebar-rpg-0.20.0-restored.zip artifacts/spacebar-rpg-0.20.0-restored.zip.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
