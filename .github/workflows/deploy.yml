name: Test and deploy GitHub Pages
on:
  push:
    branches: [main, feature/v0.21.3-avatar-fixes]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish tested 0.21.1 ZIP and visual evidence (world-fixes branch only)
        type: boolean
        default: false
        required: false
      publish_site_preview:
        description: Publish /test/0.21.3/ while retaining all three existing versions
        type: boolean
        default: false
        required: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    if: (github.event_name != 'workflow_dispatch' || !inputs.publish_site_preview) && (github.event_name != 'pull_request' || github.head_ref != 'feature/v0.21.3-avatar-fixes')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Trust this checkout inside the browser container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:browser
        env:
          SPACEBAR_BROWSERS: ${{ matrix.browser }}
      - name: Save browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-launch-tests-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: matrix.browser == 'chromium'
        with:
          path: dist
  site_preview:
    if: github.ref == 'refs/heads/feature/v0.21.3-avatar-fixes' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_site_preview))
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    timeout-minutes: 35
    environment:
      name: github-pages-test
      url: https://64zszfrgmd-afk.github.io/Space-bar-rpg/test/0.21.3/
    concurrency:
      group: github-pages-production
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Trust this checkout inside the browser container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build isolated test path and storage namespace
        env:
          VITE_SAVE_PREFIX: 'spacebar-test-0213:'
        run: npx vite build --base=/Space-bar-rpg/test/0.21.3/ --outDir=preview-dist-0213
      - run: node scripts/prepare-pages-preview.mjs check-production
      - run: node scripts/prepare-pages-preview.mjs assemble
      - run: node scripts/preview-pages-smoke.mjs
      - name: Test all five avatars through the mobile editor
        env:
          SPACEBAR_HERO_FOLDER: pages-preview-0213/test/0.21.3
          SPACEBAR_HERO_BASE: /Space-bar-rpg/test/0.21.3/
          SPACEBAR_HERO_SAVE_PREFIX: 'spacebar-test-0213:'
        run: npm run test:hero
      - run: node scripts/prepare-pages-preview.mjs publish-report
      - name: Refuse to overwrite a newer production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-pages-preview.mjs guard-main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-test-0213
          path: pages-preview-0213
      - name: Publish the preserved site with its new test subdirectory
        id: publish
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-test-0213
      - run: node scripts/prepare-pages-preview.mjs verify-published
      - name: Test the published HTTPS address in Chromium and WebKit
        env:
          SPACEBAR_LIVE_URL: https://64zszfrgmd-afk.github.io/Space-bar-rpg/test/0.21.3/
        run: node scripts/preview-pages-smoke.mjs
      - name: Test avatar changes on the published HTTPS site
        env:
          SPACEBAR_HERO_URL: https://64zszfrgmd-afk.github.io/Space-bar-rpg/test/0.21.3/
          SPACEBAR_HERO_SAVE_PREFIX: 'spacebar-test-0213:'
        run: node tests/hero-appearance.mjs
      - name: Save staged and live browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-preview-0213-evidence
          path: |
            test-results/pages-preview/
            test-results/hero-appearance/
            test-results/avatar-comparison/
          retention-days: 14
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages-production
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

  release_preview:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_preview && github.ref == 'refs/heads/feature/v0.21-world-fixes'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: v0211-touch-flow-release
      cancel-in-progress: false
    env:
      RELEASE_TAG: v0.21.1-preview.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python3 scripts/package-release.py
      - uses: actions/download-artifact@v4
        with:
          name: mobile-launch-tests
          path: test-results
      - run: python3 scripts/package-visual-report.py
      - name: Upload source and build ZIP, then publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/spacebar-release-notes.md"
          cat > "$notes" <<EOF
          **Space Bar RPG 0.21.1 — диагностическая сборка для повторной проверки iPhone** поверх main 0.21.0.

          Проверен полный путь касание → пропуск → сцена → управление. Добавлены явные причины отказа, предъявление пропуска на карте, согласование старых сохранений и резервная копия. Постоянная диагностическая панель и журнал касаний; выбор NPC и обычный подход по проходам. Физическая причина конкретного iPhone без нового отчёта остаётся неподтверждённой. Переход строит и отрисовывает новую сцену перед сменой состояния; при ошибке сохраняет предыдущий мир и прогресс. Добавлены диагностика и повтор загрузки. Сохранены девять интерьеров, три новые планеты, 23 NPC, пять героев, десять заданий, экономика, напитки, сиденья, танцы, ритм и сохранения.

          ZIP игры содержит исходники и готовый dist. RELEASE-MANIFEST.json указывает коммит и SHA-256 файлов. Отдельный visual-report.zip содержит реальные PNG/HTML/JSON Chromium и WebKit: 9 локаций, 23 NPC, 5 героев, видимые пиксели и дополнительные полные production touch-сценарии нового прохождения и сохранений 0.20 R2 / 0.21. PNG контактных листов доступны отдельно. У архивов есть .sha256. Все девять локаций и имена жителей перечислены в docs/TOUCH-TRAVEL-0211.md.

          Запуск: Node.js 22.12+, npm install, npm run preview -- --port 5173, путь /Space-bar-rpg/. На iPhone открыть HTTPS-предпросмотр порта 5173 в Safari. ZIP в приложении «Файлы» не запускает игру.

          Исходный коммит: $GITHUB_SHA.
          Проверки: npm ci, Vitest, TypeScript/Vite, production URL/MIME, полный браузерный прогон Chromium/WebKit. Физический iPhone и FPS не проверены.
          [Проверки и публикация]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).

          Ветка feature/v0.21-world-fixes подготовлена в отдельном Pull Request. Merge и production Pages — только после подтверждения владельца. Старые релизы сохранены.

          EOF
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]; then
              echo 'Existing published release must not be overwritten; choose a new preview tag.'
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease --title 'Space Bar RPG 0.21.1 — повторная проверка iPhone' --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" artifacts/spacebar-rpg-0.21.1.zip artifacts/spacebar-rpg-0.21.1.zip.sha256 artifacts/spacebar-rpg-0.21.1-visual-report.zip artifacts/spacebar-rpg-0.21.1-visual-report.zip.sha256 test-results/world-visual/*-contact-sheet.png --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
