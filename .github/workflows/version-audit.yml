name: Audit published game

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/version-audit.yml
      - docs/VERSION-COMPARISON.md
      - scripts/audit-published.mjs
      - tests/mobile-launch.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Test the actual HTTPS page
        run: npm run test:browser
        env:
          SPACEBAR_TEST_URL: https://64zszfrgmd-afk.github.io/Space-bar-rpg/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-mobile-audit
          path: test-results/published/
          if-no-files-found: ignore
